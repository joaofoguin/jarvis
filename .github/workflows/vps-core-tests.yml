name: VPS core tests

on:
  push:
    branches:
      - feat/vps-core-foundation
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-vps-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-vps-dev.txt
      - name: Run VPS core tests
        run: python -m pytest tests/test_vps_core.py -q
