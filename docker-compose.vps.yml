services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.vps
    env_file:
      - .env.vps
    environment:
      APP_ENV: production
      AUTO_CREATE_SCHEMA: "false"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    profiles: ["tls"]
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - .env.vps
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
