<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>JARVIS</title>
<style>
  :root { --accent: #3FD4F5; --ground: #070B12; --panel: #0D1520; --line: #1B2A3A; --text: #E6F1FA; --muted: #8FA6BA; }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--text); font: 15px/1.5 "Segoe UI", Inter, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }

  header { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .dot {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    background: radial-gradient(circle at 50% 45%, #fff 0%, var(--accent) 40%, var(--panel) 100%);
    box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 55%, transparent);
  }
  .name { font: 600 13px/1 "Segoe UI", sans-serif; letter-spacing: 4px; color: var(--muted); }
  #state { margin-left: auto; font-size: 13px; color: var(--muted); }

  #log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .message { max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .jarvis { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
  .user { align-self: flex-end; background: #13202E; }

  form { display: flex; gap: 8px; padding: 12px 18px 18px; }
  input {
    flex: 1; min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); font: inherit;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    width: 44px; height: 44px; border-radius: 12px; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #talk { background: transparent; border: 1px solid var(--accent); color: var(--text); }
  #send { background: var(--accent); color: #04111A; }
</style>
</head>
<body>
<header>
  <div class="dot" aria-hidden="true"></div>
  <span class="name">J.A.R.V.I.S.</span>
  <span id="state" aria-live="polite"></span>
</header>

<main id="log" aria-live="polite"></main>

<form id="form">
  <label for="text" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Mensagem</label>
  <input id="text" autocomplete="off" placeholder="Fale com o JARVIS">
  <button type="button" id="talk" aria-label="Falar">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
  </button>
  <button type="submit" id="send" aria-label="Enviar">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
  </button>
</form>

<script>
  const STATES = { idle: "", listening: "ouvindo…", thinking: "pensando…", speaking: "falando…" };
  const log = document.getElementById("log");
  const input = document.getElementById("text");

  // Chamadas pelo Python. O texto entra como texto, nunca como HTML.
  function addMessage(author, text) {
    const message = document.createElement("div");
    message.className = `message ${author}`;
    message.textContent = text;
    log.appendChild(message);
    log.scrollTop = log.scrollHeight;
  }

  function setState(state) { document.getElementById("state").textContent = STATES[state] || ""; }
  function setAccent(color) { document.documentElement.style.setProperty("--accent", color); }
  function focusInput() { input.focus(); }

  document.getElementById("form").addEventListener("submit", (event) => {
    event.preventDefault();
    const text = input.value.trim();

    if (text) {
      input.value = "";
      window.pywebview.api.send(text);
    }
  });

  document.getElementById("talk").addEventListener("click", () => window.pywebview.api.talk());

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") window.pywebview.api.hide_chat();
  });
</script>
</body>
</html>
