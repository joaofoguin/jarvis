<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>JARVIS</title>
<style>
  :root { --accent: #3FD4F5; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body { display: flex; align-items: center; justify-content: center; cursor: pointer; }

  .orb { position: relative; width: 150px; height: 150px; display: flex; align-items: center; justify-content: center; }
  .core {
    width: 56px; height: 56px; border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, #fff 0%, var(--accent) 40%, #0D1520 100%);
    box-shadow: 0 0 28px color-mix(in srgb, var(--accent) 60%, transparent);
    animation: breathe 4s ease-in-out infinite;
  }
  .ring {
    position: absolute; inset: 40px; border-radius: 50%;
    border: 2px dashed color-mix(in srgb, var(--accent) 45%, transparent);
    animation: spin 24s linear infinite;
  }
  .ripple {
    position: absolute; inset: 8px; border-radius: 50%;
    border: 2px solid var(--accent); opacity: 0;
  }
  .bars { position: absolute; inset: 0; opacity: 0; transition: opacity .2s; }
  .bar { position: absolute; left: 74px; top: 75px; width: 3px; height: 0; }
  .bar span {
    position: absolute; left: 0; bottom: 34px; width: 3px; border-radius: 2px;
    background: var(--accent); transform-origin: bottom;
    animation: bar .6s ease-in-out infinite;
  }

  [data-state="listening"] .ripple { animation: ripple 2.1s ease-out infinite; }
  [data-state="listening"] .ripple:nth-child(2) { animation-delay: .7s; }
  [data-state="listening"] .ripple:nth-child(3) { animation-delay: 1.4s; }
  [data-state="listening"] .ring { border-color: var(--accent); animation-duration: 6s; }
  [data-state="thinking"] .ring { border-color: var(--accent); animation-duration: 1.2s; }
  [data-state="speaking"] .bars { opacity: 1; }
  [data-state="speaking"] .core { animation-duration: .9s; }

  @keyframes breathe { 0%, 100% { transform: scale(1); opacity: .85 } 50% { transform: scale(1.07); opacity: 1 } }
  @keyframes spin { to { transform: rotate(360deg) } }
  @keyframes ripple { 0% { transform: scale(.45); opacity: .9 } 100% { transform: scale(1); opacity: 0 } }
  @keyframes bar { 0%, 100% { transform: scaleY(.3) } 50% { transform: scaleY(1) } }
</style>
</head>
<body title="Clique para falar · botão direito abre o chat">
<div class="orb" id="orb" data-state="idle">
  <div class="ripple"></div><div class="ripple"></div><div class="ripple"></div>
  <div class="bars" id="bars"></div>
  <div class="ring"></div>
  <div class="core"></div>
</div>
<script>
  // Barras em volta do orbe, como o equalizador do filme.
  const bars = document.getElementById("bars");

  for (let i = 0; i < 28; i++) {
    const bar = document.createElement("div");
    const line = document.createElement("span");
    bar.className = "bar";
    bar.style.transform = `rotate(${i * 360 / 28}deg)`;
    line.style.height = `${10 + (i * 7 % 5) * 3}px`;
    line.style.animationDuration = `${0.45 + (i * 3 % 4) * 0.1}s`;
    line.style.animationDelay = `${(i * 5 % 8) * 0.06}s`;
    bar.appendChild(line);
    bars.appendChild(bar);
  }

  // Chamadas pelo Python.
  function setState(state) { document.getElementById("orb").dataset.state = state; }
  function setAccent(color) { document.documentElement.style.setProperty("--accent", color); }

  // O orbe pode ser arrastado; só conta como clique se ele não saiu do lugar.
  let pressed = null;
  document.body.addEventListener("mousedown", (event) => { pressed = [event.screenX, event.screenY]; });
  document.body.addEventListener("click", (event) => {
    if (pressed && Math.hypot(event.screenX - pressed[0], event.screenY - pressed[1]) < 5) {
      window.pywebview.api.talk();
    }
  });
  document.body.addEventListener("contextmenu", (event) => {
    event.preventDefault();
    window.pywebview.api.toggle_chat();
  });
</script>
</body>
</html>
